events { worker_connections 1024; }

http {
    # Docker service IPs change after docker compose recreates containers.
    # Resolve admin through Docker embedded DNS on each request-cache expiry.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    # Rate limiting: max 30 req/s per IP, burst 60; max 20 concurrent connections
    limit_req_zone  $binary_remote_addr zone=portal:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=portal_conn:10m;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Port 80: webhooks + VPN subscription ─────────────────────────────
    # Legacy/plain-HTTP callback ingress. Providers that require HTTPS (for example YooKassa) must not be enabled until a valid public TLS endpoint is configured.
    # /sub/ is the public VPN subscription endpoint — VPN apps auto-refresh config from here.
    # Everything else on this port is silently dropped.
    server {
        listen 80;
        server_name _;
        set $admin_upstream "admin:8000";

        location /webhooks/ {
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://$admin_upstream;
        }

        location /sub/ {
            limit_req zone=portal burst=5 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://$admin_upstream;
        }

        location / {
            return 444;
        }
    }

    # ── Port 29148: admin + portal (non-standard, not found by scanners) ─
    server {
        listen 29148;
        server_name _;
        set $admin_upstream "admin:8000";
        client_max_body_size 50m;

        limit_req  zone=portal burst=60 nodelay;
        limit_conn portal_conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;

        # Internal-only backend endpoints must not be reachable through the
        # public /admin/ prefix rewrite below.
        location = /admin/metrics { return 404; }
        location = /admin/_health { return 404; }
        location = /admin/alertmanager-webhook { return 404; }

        location /admin/ {
            # Strip public /admin/ prefix before proxying to FastAPI root.
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$admin_upstream;
        }

        location /portal/ {
            proxy_pass http://$admin_upstream;
        }

        location /sub/ {
            limit_req zone=portal burst=10 nodelay;
            proxy_pass http://$admin_upstream;
        }

        location = /_health {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://$admin_upstream;
            access_log off;
        }

        location /metrics {
            deny all;
        }

        location = / {
            return 301 /admin/;
        }

        location / {
            return 444;
        }
    }
}
