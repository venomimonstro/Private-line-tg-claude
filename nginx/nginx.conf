events { worker_connections 1024; }

http {
    # Docker service IPs change after compose recreates containers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    limit_req_zone  $binary_remote_addr zone=portal:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=portal_conn:10m;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Plain HTTP is retained only for legacy provider callbacks. Never serve
    # VPN bearer credentials or admin/portal content over cleartext.
    server {
        listen 80;
        server_name _;
        set $admin_upstream "admin:8000";

        # Certbot webroot challenge for a publicly trusted IP certificate.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location /admin/ { return 308 https://$host$request_uri; }

        location /webhooks/ {
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_pass http://$admin_upstream;
        }

        location /sub/ {
            return 308 https://$host$request_uri;
        }

        location / {
            return 444;
        }
    }

    # Public encrypted control-plane ingress. A valid public-CA certificate is
    # recommended; node bootstrap additionally pins the certificate SPKI.
    server {
        listen 443 ssl;
        server_name _;
        set $admin_upstream "admin:8000";
        client_max_body_size 50m;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        limit_req  zone=portal burst=60 nodelay;
        limit_conn portal_conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;

        location = /admin/metrics { return 404; }
        location = /admin/_health { return 404; }
        location = /admin/alertmanager-webhook { return 404; }

        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$admin_upstream;
        }

        # User-initiated, bearer-token authenticated Windows diagnostics.
        location = /api/windows-diagnostics {
            client_max_body_size 8k;
            proxy_pass http://$admin_upstream;
        }

        # Personal one-time desktop activation, profile refresh and scoped
        # diagnostic uploads. No credentials in GET URLs or proxy access logs.
        location = /api/windows/enroll {
            client_max_body_size 4k;
            limit_req zone=portal burst=10 nodelay;
            proxy_pass http://$admin_upstream;
        }
        location = /api/windows/install-report {
            client_max_body_size 4k;
            limit_req zone=portal burst=10 nodelay;
            proxy_pass http://$admin_upstream;
        }
        location = /api/windows/profile {
            limit_req zone=portal burst=10 nodelay;
            proxy_pass http://$admin_upstream;
            add_header Cache-Control "no-store" always;
        }
        location = /api/windows/report {
            client_max_body_size 8k;
            limit_req zone=portal burst=10 nodelay;
            proxy_pass http://$admin_upstream;
        }

        location /portal/ {
            proxy_pass http://$admin_upstream;
        }

        location /sub/ {
            limit_req zone=portal burst=10 nodelay;
            proxy_pass http://$admin_upstream;
        }

        location /webhooks/ {
            proxy_pass http://$admin_upstream;
        }

        location = /_health {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://$admin_upstream;
            access_log off;
        }

        location /metrics { deny all; }

        location = / { return 301 /admin/; }
        location / { return 444; }
    }

    # Emergency/local diagnostic ingress only. Docker publishes this listener
    # to 127.0.0.1, so it cannot expose credentials on the public interface.
    server {
        listen 29148;
        server_name _;
        set $admin_upstream "admin:8000";
        client_max_body_size 50m;

        limit_req  zone=portal burst=60 nodelay;
        limit_conn portal_conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto http;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        location = /admin/metrics { return 404; }
        location = /admin/_health { return 404; }
        location = /admin/alertmanager-webhook { return 404; }

        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$admin_upstream;
        }
        location /portal/ { proxy_pass http://$admin_upstream; }
        location /sub/    { proxy_pass http://$admin_upstream; }

        location = /_health {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://$admin_upstream;
            access_log off;
        }
        location /metrics { deny all; }
        location = / { return 301 /admin/; }
        location / { return 444; }
    }
}
