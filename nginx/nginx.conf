events { worker_connections 1024; }

http {
    # Docker internal DNS — re-resolve upstream IPs dynamically.
    # Without this nginx caches the IP at startup and gives 502
    # whenever the admin container is recreated (gets a new IP).
    resolver 127.0.0.11 valid=30s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        # Retry on 502/503/504 — survives admin restarts transparently
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Admin panel — strip /admin/ prefix.
        # $upstream variable forces DNS re-resolution on every request
        # instead of caching the IP at startup.
        location /admin/ {
            set $upstream http://admin:8000;
            proxy_pass $upstream/;
        }

        # Payment webhooks
        location /webhooks/ {
            set $upstream http://admin:8000;
            proxy_pass $upstream/webhooks/;
        }

        # Health check — used by deploy script, no auth required
        location = /_health {
            set $upstream http://admin:8000;
            proxy_pass $upstream/_health;
            access_log off;
        }

        # Block Prometheus metrics from outside
        location /metrics {
            deny all;
        }

        location = / {
            return 301 /admin/;
        }
    }
}
