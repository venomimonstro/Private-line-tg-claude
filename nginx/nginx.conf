events { worker_connections 1024; }

http {
    # Real visitor IP: Cloudflare puts it in CF-Connecting-IP header.
    # We pass it upstream instead of the Cloudflare edge IP.
    map $http_cf_connecting_ip $cf_client_ip {
        default  $remote_addr;
        "~^.+$"  $http_cf_connecting_ip;
    }

    log_format main '$remote_addr ($cf_client_ip) - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $cf_client_ip;
        proxy_set_header X-Forwarded-For   $cf_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;

        # ── Webhooks: open for all IPs (payment providers post directly) ──
        location /webhooks/ {
            proxy_pass http://admin:8000/webhooks/;
        }

        # ── Health check: internal only ───────────────────────────────────
        location = /_health {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://admin:8000/_health;
            access_log off;
        }

        # ── Metrics: always blocked ───────────────────────────────────────
        location /metrics {
            deny all;
        }

        # ── Admin panel: Cloudflare IPs only ─────────────────────────────
        location /admin/ {
            include /etc/nginx/cloudflare_ips.conf;
            proxy_pass http://admin:8000/;
        }

        # ── Web portal: Cloudflare IPs only ──────────────────────────────
        location /portal/ {
            include /etc/nginx/cloudflare_ips.conf;
            proxy_pass http://admin:8000/portal/;
        }

        # ── Root redirect: Cloudflare IPs only ───────────────────────────
        location = / {
            include /etc/nginx/cloudflare_ips.conf;
            return 301 /admin/;
        }

        # ── Everything else: silently drop ───────────────────────────────
        location / {
            return 444;
        }
    }
}
