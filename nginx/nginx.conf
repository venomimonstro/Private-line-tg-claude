events { worker_connections 1024; }

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        # Admin panel — strip /admin/ prefix, FastAPI sees /login /users etc.
        location /admin/ {
            proxy_pass         http://admin:8000/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Payment webhooks — forwarded as-is (no prefix stripping)
        location /webhooks/ {
            proxy_pass         http://admin:8000/webhooks/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check — no auth required
        location = /_health {
            proxy_pass http://admin:8000/_health;
            access_log off;
        }

        # Block Prometheus metrics from outside
        location /metrics {
            deny all;
        }

        # Redirect bare root to admin
        location = / {
            return 301 /admin/;
        }
    }
}
