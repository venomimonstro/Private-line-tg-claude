events { worker_connections 1024; }

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # HTTP — direct access (no domain required)
    server {
        listen 80;
        server_name _;

        client_max_body_size 5m;

        # Admin panel — strip /admin/ prefix before forwarding to FastAPI
        location /admin/ {
            proxy_pass http://admin:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Login with rate limit
        location = /admin/login {
            limit_req zone=admin_login burst=3 nodelay;
            proxy_pass http://admin:8000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Payment webhooks
        location /webhook/ {
            limit_req zone=webhook burst=10 nodelay;
            proxy_pass http://admin:8000/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check (no auth, for Docker/uptime monitors)
        location = /_health {
            proxy_pass http://admin:8000/_health;
            access_log off;
        }

        # Block metrics from external access
        location /metrics {
            deny all;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirect root to admin panel
        location = / {
            return 301 /admin/;
        }
    }

    # HTTPS — uncomment and configure when you have a domain + SSL cert
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     include /etc/nginx/conf.d/admin_locations.conf;
    # }
}
