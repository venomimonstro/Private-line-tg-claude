events { worker_connections 1024; }

http {
    # Rate limiting: max 30 req/s per IP, burst 60; max 20 concurrent connections
    limit_req_zone  $binary_remote_addr zone=portal:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=portal_conn:10m;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # ── Port 80: webhooks + VPN subscription ─────────────────────────────
    # Payment providers (YooKassa, Lava, etc.) require port 80 for callbacks.
    # /sub/ is the public VPN subscription endpoint — VPN apps auto-refresh config from here.
    # Everything else on this port is silently dropped.
    server {
        listen 80;
        server_name _;

        location /webhooks/ {
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://admin:8000/webhooks/;
        }

        location /sub/ {
            limit_req zone=portal burst=5 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://admin:8000/sub/;
        }

        location / {
            return 444;
        }
    }

    # ── Port 29148: admin + portal (non-standard, not found by scanners) ─
    server {
        listen 29148;
        server_name _;
        client_max_body_size 50m;

        limit_req  zone=portal burst=60 nodelay;
        limit_conn portal_conn 20;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 10s;

        location /admin/ {
            proxy_pass http://admin:8000/;
        }

        location /portal/ {
            proxy_pass http://admin:8000/portal/;
        }

        location = /_health {
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://admin:8000/_health;
            access_log off;
        }

        location /metrics {
            deny all;
        }

        location = / {
            return 301 /admin/;
        }

        location / {
            return 444;
        }
    }
}
