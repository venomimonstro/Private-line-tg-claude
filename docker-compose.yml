services:
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./bot:/app/bot
      - ./backup_manager:/app/backup_manager
      - ./health_monitor:/app/health_monitor
      - ./update_manager:/app/update_manager
      - ./alembic:/app/alembic
      - ./migrations:/app/migrations
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - db
    networks:
      - privateline

  admin:
    build: .
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./admin:/app/admin
      - ./bot:/app/bot
      - ./backup_manager:/app/backup_manager
      - ./health_monitor:/app/health_monitor
      - ./update_manager:/app/update_manager
      - ./alembic:/app/alembic
      - ./migrations:/app/migrations
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./tests:/app/tests:ro
      - ./install_node.sh:/app/install_node.sh:ro
      - ./fix_reality.sh:/app/fix_reality.sh:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - db
    networks:
      - privateline

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privateline
      POSTGRES_USER: privateline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m
    networks:
      - privateline

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.51.0
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
      - '--query.max-concurrency=2'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    networks:
      - privateline

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    networks:
      - privateline

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_RENDERING_CONCURRENT_RENDER_LIMIT: 2
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    networks:
      - privateline
    depends_on:
      - prometheus

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.7.0
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    networks:
      - privateline

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "29148:29148"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    networks:
      - privateline
    depends_on:
      - admin

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  privateline:
    driver: bridge
