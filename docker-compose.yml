version: "3.9"

services:
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./bot:/app/bot
      - ./backup_manager:/app/backup_manager
      - ./health_monitor:/app/health_monitor
      - ./update_manager:/app/update_manager
      - ./alembic:/app/alembic
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - privateline

  admin:
    build: .
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./app:/app/app
      - ./admin:/app/admin
      - ./bot:/app/bot
      - ./backup_manager:/app/backup_manager
      - ./health_monitor:/app/health_monitor
      - ./update_manager:/app/update_manager
      - ./alembic:/app/alembic
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - db
    networks:
      - privateline

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privateline
      POSTGRES_USER: privateline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - privateline

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - privateline

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    restart: unless-stopped
    networks:
      - privateline

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - privateline
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    networks:
      - privateline

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - privateline
    depends_on:
      - admin

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  privateline:
    driver: bridge
