services:
  bot:
    image: private-line-app:runtime
    command: python -m bot.main
    env_file: .env
    environment:
      - PYTHONPATH=/app
    # Production application code is immutable inside the image. Only runtime
    # state is bind-mounted; git operations cannot mutate a running process.
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /app/backups
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - privateline

  admin:
    image: private-line-app:runtime
    build:
      context: .
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips="*"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./backups
        target: /app/backups
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - privateline

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privateline
      POSTGRES_USER: privateline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privateline -d privateline"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - privateline

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.51.0
    volumes:
      - type: bind
        source: ./monitoring/prometheus
        target: /etc/prometheus
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
      - '--query.max-concurrency=2'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    networks:
      - privateline

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.27.0
    volumes:
      - type: bind
        source: ./monitoring/alertmanager
        target: /etc/alertmanager
        read_only: true
        bind:
          create_host_path: false
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    networks:
      - privateline

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_RENDERING_CONCURRENT_RENDER_LIMIT: 2
    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ./monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    networks:
      - privateline
    depends_on:
      - prometheus

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.7.0
    command:
      - '--path.rootfs=/host'
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    networks:
      - privateline

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
      # Legacy plain-HTTP admin port is localhost-only. Use public HTTPS :443.
      - "127.0.0.1:29148:29148"
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/ssl
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    networks:
      - privateline
    depends_on:
      admin:
        condition: service_healthy

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  privateline:
    driver: bridge
