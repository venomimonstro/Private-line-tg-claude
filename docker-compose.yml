version: "3.9"

services:
  bot:
    build: .
    command: python bot/main.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - privateline

  admin:
    build: .
    command: uvicorn admin.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - privateline

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privateline
      POSTGRES_USER: privateline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - privateline

volumes:
  pgdata:

networks:
  privateline:
    driver: bridge
