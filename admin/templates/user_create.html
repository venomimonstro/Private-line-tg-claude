{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <div class="card p-4">
      <form method="post" action="/admin/users/create" class="needs-validation" novalidate>
        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label fw-semibold">Telegram ID <span class="text-danger">*</span></label>
            <input type="number" name="telegram_id" class="form-control font-monospace"
                   placeholder="123456789" required>
            <div class="form-text">Числовой идентификатор пользователя Telegram.</div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text">@</span>
              <input type="text" name="username" class="form-control"
                     placeholder="username" maxlength="255">
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Имя</label>
            <input type="text" name="first_name" class="form-control"
                   placeholder="Иван" maxlength="255">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Фамилия</label>
            <input type="text" name="last_name" class="form-control"
                   placeholder="Иванов" maxlength="255">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control"
                   placeholder="user@example.com" maxlength="255">
          </div>

          <div class="col-12">
            <hr class="my-1">
            <h6 class="fw-semibold mb-2 mt-1">Подписка (необязательно)</h6>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Тариф</label>
            <select name="tariff_id" id="tariff_id" class="form-select" onchange="onTariffChange()">
              <option value="">— Без тарифа —</option>
              {% for t in tariffs %}
              <option value="{{ t.id }}">{{ t.name }} ({{ t.duration_days }} дн., {{ t.price_monthly }} {{ t.currency }})</option>
              {% endfor %}
            </select>
            <div class="form-text">Создать подписку на выбранный тариф.</div>
          </div>

          <div class="col-md-6 d-flex align-items-end pb-1" id="activate_block" style="display:none!important">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="activate_key" id="activate_key">
              <label class="form-check-label fw-semibold" for="activate_key">
                Сразу активировать и выдать VPN-ключ
              </label>
            </div>
          </div>

          <div class="col-12 d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-person-plus-fill"></i> Создать пользователя
            </button>
            <a href="/admin/users" class="btn btn-outline-secondary">Отмена</a>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.querySelectorAll('form.needs-validation').forEach(function (form) {
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  });

  function onTariffChange() {
    const block = document.getElementById('activate_block');
    const val = document.getElementById('tariff_id').value;
    block.style.display = val ? '' : 'none';
  }
  onTariffChange();
</script>
{% endblock %}
