<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Private X Line{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-base:    #0d0f18;
      --bg-surface: #151823;
      --bg-card:    #1b1e2c;
      --bg-input:   #111320;
      --border:     #272b40;
      --border-hi:  #5c6bc0;
      --text-base:  #dde1f5;
      --text-muted: #6b728f;
      --text-dim:   #3f4460;
      --accent:     #5c6bc0;
      --accent-hi:  #7986cb;
      --green:      #4caf7d;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: var(--bg-base);
      color: var(--text-base);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: .9375rem;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .pxl-nav {
      background: #0b0d15;
      border-bottom: 1px solid var(--border);
      padding: .75rem 0;
    }
    .pxl-brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-base) !important;
      text-decoration: none;
      letter-spacing: .3px;
    }
    .pxl-brand:hover { color: var(--accent-hi) !important; }
    .pxl-brand .x { color: var(--accent-hi); }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .card-hover { transition: border-color .18s, box-shadow .18s; cursor: pointer; }
    .card-hover:hover {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px rgba(92,107,192,.18);
    }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--accent-hi);
      border-color: var(--accent-hi);
      color: #fff;
    }
    .btn-outline-portal {
      color: var(--text-muted);
      border: 1px solid var(--border);
      background: transparent;
      font-size: .85rem;
    }
    .btn-outline-portal:hover {
      color: var(--text-base);
      border-color: var(--border-hi);
      background: rgba(92,107,192,.08);
    }

    /* ── Form controls — force dark theme ── */
    .form-control, .form-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-base);
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--bg-input);
      border-color: var(--border-hi);
      color: var(--text-base);
      box-shadow: 0 0 0 3px rgba(92,107,192,.2);
    }
    .form-control::placeholder { color: var(--text-dim); }
    .form-control[readonly] {
      background: #0f1120;
      color: var(--accent-hi);
      border-color: var(--border);
      cursor: text;
    }
    .input-group-text {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--text-muted);
    }
    .form-label { color: var(--text-base); font-weight: 500; margin-bottom: .4rem; }
    .form-text  { color: var(--text-muted) !important; font-size: .8rem; }

    /* Checkbox */
    .form-check-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border);
    }
    .form-check-input:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    .form-check-input:focus { box-shadow: 0 0 0 3px rgba(92,107,192,.2); }
    .form-check-label { color: var(--text-muted); font-size: .85rem; }

    /* ── Alerts ── */
    .alert-danger {
      background: rgba(220,53,69,.12);
      border-color: rgba(220,53,69,.35);
      color: #f0909a;
      border-radius: 10px;
    }
    .alert-success {
      background: rgba(76,175,125,.12);
      border-color: rgba(76,175,125,.35);
      color: #7de0b0;
      border-radius: 10px;
    }

    /* ── Badges ── */
    .badge-pill { border-radius: 50px; padding: .3em .7em; font-weight: 500; font-size: .72rem; }
    .badge-recurring { background: rgba(108,117,125,.25); color: #9aa0b8; }
    .badge-onetime   { background: rgba(92,107,192,.25); color: #8c9de0; }

    /* ── Prices ── */
    .price-big { font-size: 2.1rem; font-weight: 700; line-height: 1.1; color: var(--text-base); }
    .price-currency { font-size: 1rem; color: var(--text-muted); font-weight: 400; }
    .price-promo { color: var(--green); font-size: .8rem; }

    /* ── Feature list ── */
    .feature-list { list-style: none; padding: 0; margin: 0; }
    .feature-list li {
      padding: .2rem 0;
      color: var(--text-muted);
      font-size: .875rem;
    }
    .feature-list li::before { content: "✓ "; color: var(--green); font-weight: 700; }

    /* ── Text overrides ── */
    .text-muted  { color: var(--text-muted) !important; }
    .text-success { color: var(--green) !important; }
    a { color: var(--accent-hi); }
    a:hover { color: #aab7f0; }

    /* ── Footer ── */
    .pxl-footer {
      border-top: 1px solid var(--border);
      margin-top: 4rem;
      padding: 1.75rem 0;
      color: var(--text-dim);
      font-size: .8rem;
    }

    /* ── Misc ── */
    .divider-text {
      border-top: 1px solid var(--border);
      text-align: center;
      position: relative;
      margin: 1.25rem 0;
    }
    .font-monospace { font-family: 'Courier New', monospace; }
    code { color: var(--accent-hi); background: rgba(92,107,192,.12); padding: .1em .4em; border-radius: 4px; }
  </style>
</head>
<body>
<nav class="pxl-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="pxl-brand" href="/portal/">
      <i class="bi bi-shield-lock-fill me-2" style="color:var(--accent-hi)"></i>Private&nbsp;<span class="x">X</span>&nbsp;Line
    </a>
    <span style="color:var(--text-dim);font-size:.8rem">Безопасный VPN</span>
  </div>
</nav>

<div class="container py-4 py-md-5">
  {% block content %}{% endblock %}
</div>

<div class="pxl-footer">
  <div class="container text-center">
    Private X Line &mdash; безопасный доступ в интернет
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
