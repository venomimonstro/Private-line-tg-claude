<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Private Line VPN{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #0f1117; color: #e8eaf0; min-height: 100vh; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
    .card { background: #1a1d27; border: 1px solid #2a2d3e; }
    .card-hover:hover { border-color: #5c6bc0; box-shadow: 0 0 0 2px #5c6bc033; transition: .2s; }
    .btn-primary { background: #5c6bc0; border-color: #5c6bc0; }
    .btn-primary:hover { background: #4a5ab0; border-color: #4a5ab0; }
    .badge-pill { border-radius: 50px; padding: .35em .75em; }
    .text-muted { color: #7c82a0 !important; }
    a { color: #8c9de0; }
    a:hover { color: #aab7f0; }
    .price-big { font-size: 2.2rem; font-weight: 700; line-height: 1; }
    .price-currency { font-size: 1.1rem; color: #7c82a0; }
    .feature-list { list-style: none; padding: 0; margin: 0; }
    .feature-list li::before { content: "✓ "; color: #66bb6a; font-weight: 700; }
    .portal-footer { border-top: 1px solid #2a2d3e; margin-top: 4rem; padding: 2rem 0; color: #4a4e68; font-size: .85rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#13151f;border-bottom:1px solid #2a2d3e">
  <div class="container">
    <a class="navbar-brand" href="/portal/">
      <i class="bi bi-shield-lock-fill text-primary me-2"></i>Private Line
    </a>
    <span class="text-muted small">Надёжный VPN</span>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<div class="portal-footer">
  <div class="container text-center">
    Private Line VPN &mdash; безопасный доступ в интернет
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
