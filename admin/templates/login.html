<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Private Line Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: #fff; border-radius: 12px; padding: 2rem; max-width: 400px; width: 100%; }
    </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-auto">
      <div class="login-card shadow">
        <div class="text-center mb-4">
          <div class="fs-2 mb-2">🔐</div>
          <h5 class="fw-bold">Private Line Admin</h5>
          <p class="text-muted small">Введите учётные данные</p>
        </div>
        {% if error %}
        <div class="alert alert-danger small">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login">
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
